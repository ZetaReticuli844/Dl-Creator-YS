server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://dl-creator-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: spring-boot-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: dl-creator-backend
          service: backend
          __path__: /var/log/backend.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
            thread: thread_name
      - regex:
          expression: '"@timestamp":"(?P<timestamp>[^"]+)"'
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          logger:
          thread:
      - output:
          source: message

  - job_name: spring-boot-backend-console
    static_configs:
      - targets:
          - localhost
        labels:
          job: dl-creator-backend-console
          service: backend
          __path__: /var/log/backend/console.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            thread: thread
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          logger:
          thread:
      - output:
          source: message

  - job_name: rasa-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: dl-creator-rasa-server
          service: rasa
          __path__: /var/log/rasa-server.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            module: module
            function: function
            line: line
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
      - labels:
          level:
          logger:
          module:
          function:
      - output:
          source: message

  - job_name: frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: dl-creator-frontend
          service: frontend
          __path__: /var/log/frontend.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            message: message
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
      - output:
          source: message
