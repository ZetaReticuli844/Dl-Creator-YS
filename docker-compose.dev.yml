services:
  # Frontend React Application (Development)
  frontend-dev:
    build:
      context: ./frontend/dl-creator
      dockerfile: Dockerfile.dev
    container_name: dl-creator-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:7500
      - REACT_APP_RASA_URL=http://localhost:5005
    volumes:
      - ./frontend/dl-creator:/app
      - /app/node_modules
    networks:
      - dl-creator-network
    restart: unless-stopped
    command: npm run dev

  # Backend Spring Boot Application (Development)
  backend-dev:
    build:
      context: ./backend/dl_creator
      dockerfile: Dockerfile
    container_name: dl-creator-backend-dev
    ports:
      - "7500:7500"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:dl_creator_db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_H2_CONSOLE_ENABLED=true
      - SPRING_H2_CONSOLE_PATH=/h2-console
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      - SPRING_JPA_OPEN_IN_VIEW=false
      - SECURITY_JWT_SECRET_KEY=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
      - SECURITY_JWT_EXPIRATION_TIME=3600000
      - SERVER_PORT=7500
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    volumes:
      - ./backend/dl_creator:/app
      - /app/target
    networks:
      - dl-creator-network
    restart: unless-stopped
    command: ./mvnw spring-boot:run

  # Rasa Action Server (Development)
  action-server-dev:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: dl-creator-action-server-dev
    ports:
      - "5055:5055"
    volumes:
      - ./chatbot/actions:/app/actions
      - ./chatbot/domain.yml:/app/domain.yml
      - ./chatbot/config.yml:/app/config.yml
    environment:
      - RASA_SERVER_URL=http://rasa-server-dev:5005
      - RASA_TOKEN=${RASA_TOKEN:-}
      - API_BASE_URL=http://backend-dev:7500
    command: rasa run actions --port 5055 --cors "*" --enable-api --debug
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Rasa Server (Development)
  rasa-server-dev:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: dl-creator-rasa-server-dev
    ports:
      - "5005:5005"
    volumes:
      - ./chatbot/models:/app/models
      - ./chatbot/data:/app/data
      - ./chatbot/config.yml:/app/config.yml
      - ./chatbot/domain.yml:/app/domain.yml
      - ./chatbot/endpoints.yml:/app/endpoints.yml
    environment:
      - RASA_TOKEN=${RASA_TOKEN:-}
      - RASA_ACTIONS_URL=http://action-server-dev:5055/webhook
      - API_BASE_URL=http://backend-dev:7500
    depends_on:
      - action-server-dev
    networks:
      - dl-creator-network
    restart: unless-stopped
    command: rasa run --port 5005 --cors "*" --enable-api --enable-cors --debug

  # Cassandra Database for Jaeger
  cassandra-dev:
    image: cassandra:3.11
    container_name: dl-creator-cassandra-dev
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=jaeger
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_dev_data:/var/lib/cassandra
    networks:
      - dl-creator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Jaeger Schema Initialization
  jaeger-schema-dev:
    image: jaegertracing/jaeger-cassandra-schema:latest
    container_name: dl-creator-jaeger-schema-dev
    depends_on:
      cassandra-dev:
        condition: service_healthy
    networks:
      - dl-creator-network
    restart: "no"
    command: ["cassandra-dev", "3"]
    environment:
      - CQLSH_HOST=cassandra-dev
      - CQLSH_PORT=9042
      - CASSANDRA_PROTOCOL_VERSION=3
      - CASSANDRA_KEYSPACE=jaeger_v1_dc1

  # Jaeger Collector
  jaeger-collector-dev:
    image: jaegertracing/jaeger-collector:latest
    container_name: dl-creator-jaeger-collector-dev
    ports:
      - "14250:14250"  # gRPC
      - "14268:14268"  # HTTP
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - SPAN_STORAGE_TYPE=cassandra
      - CASSANDRA_SERVERS=cassandra-dev:9042
      - CASSANDRA_KEYSPACE=jaeger_v1_dc1
      - CASSANDRA_LOCAL_DC=dc1
      - COLLECTOR_OTLP_ENABLED=true
    depends_on:
      - jaeger-schema-dev
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Jaeger Query Service
  jaeger-query-dev:
    image: jaegertracing/jaeger-query:latest
    container_name: dl-creator-jaeger-query-dev
    ports:
      - "16686:16686"  # Jaeger UI
    environment:
      - SPAN_STORAGE_TYPE=cassandra
      - CASSANDRA_SERVERS=cassandra-dev:9042
      - CASSANDRA_KEYSPACE=jaeger_v1_dc1
      - CASSANDRA_LOCAL_DC=dc1
    depends_on:
      - jaeger-schema-dev
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Jaeger Agent
  jaeger-agent-dev:
    image: jaegertracing/jaeger-agent:latest
    container_name: dl-creator-jaeger-agent-dev
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
    environment:
      - REPORTER_GRPC_HOST_PORT=jaeger-collector-dev:14250
    depends_on:
      - jaeger-collector-dev
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Loki - Log Aggregation System
  loki-dev:
    image: grafana/loki:2.9.0
    container_name: dl-creator-loki-dev
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_dev_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Promtail - Log Shipper
  promtail-dev:
    image: grafana/promtail:2.9.0
    container_name: dl-creator-promtail-dev
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log
      - /var/log:/var/log/host:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki-dev
    networks:
      - dl-creator-network
    restart: unless-stopped

volumes:
  cassandra_dev_data:
  loki_dev_data:

networks:
  dl-creator-network:
    driver: bridge
