services:
  # Frontend React Application
  frontend:
    build:
      context: ./frontend/dl-creator
      dockerfile: Dockerfile
    container_name: dl-creator-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend:7500
      - REACT_APP_RASA_URL=http://rasa-server:5005
    depends_on:
      - backend
      - rasa-server
    networks:
      - dl-creator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Spring Boot Application
  backend:
    build:
      context: ./backend/dl_creator
      dockerfile: Dockerfile
    container_name: dl-creator-backend
    ports:
      - "7500:7500"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:dl_creator_db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_H2_CONSOLE_ENABLED=true
      - SPRING_H2_CONSOLE_PATH=/h2-console
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      - SPRING_JPA_OPEN_IN_VIEW=false
      - SECURITY_JWT_SECRET_KEY=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
      - SECURITY_JWT_EXPIRATION_TIME=3600000
      - SERVER_PORT=7500
    networks:
      - dl-creator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7500/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Rasa Action Server
  action-server:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: dl-creator-action-server
    ports:
      - "5055:5055"
    volumes:
      - ./chatbot/actions:/app/actions
      - ./chatbot/domain.yml:/app/domain.yml
      - ./chatbot/config.yml:/app/config.yml
    environment:
      - RASA_SERVER_URL=http://rasa-server:5005
      - RASA_TOKEN=${RASA_TOKEN:-}
      - API_BASE_URL=http://backend:7500
    command: rasa run actions --port 5055 --cors "*" --enable-api
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Rasa Server
  rasa-server:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: dl-creator-rasa-server
    ports:
      - "5005:5005"
    volumes:
      - ./chatbot/models:/app/models
      - ./chatbot/data:/app/data
      - ./chatbot/config.yml:/app/config.yml
      - ./chatbot/domain.yml:/app/domain.yml
      - ./chatbot/endpoints.yml:/app/endpoints.yml
    environment:
      - RASA_TOKEN=${RASA_TOKEN:-}
      - RASA_ACTIONS_URL=http://action-server:5055/webhook
      - API_BASE_URL=http://backend:7500
    depends_on:
      - action-server
    networks:
      - dl-creator-network
    restart: unless-stopped
    command: rasa run --port 5005 --cors "*" --enable-api --enable-cors

  # PostgreSQL Database (for production use)
  postgres:
    image: postgres:15-alpine
    container_name: dl-creator-postgres
    environment:
      POSTGRES_DB: dl_creator
      POSTGRES_USER: ${POSTGRES_USER:-dl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dl_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dl-creator-network
    restart: unless-stopped
    profiles:
      - production

  # Redis (for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: dl-creator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dl-creator-network
    restart: unless-stopped
    profiles:
      - production

  # Cassandra Database for Jaeger
  cassandra:
    image: cassandra:3.11
    container_name: dl-creator-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=jaeger
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - dl-creator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Jaeger Schema Initialization
  jaeger-schema:
    image: jaegertracing/jaeger-cassandra-schema:latest
    container_name: dl-creator-jaeger-schema
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - dl-creator-network
    restart: "no"
    command: ["cassandra", "3"]
    environment:
      - CQLSH_HOST=cassandra
      - CQLSH_PORT=9042
      - CASSANDRA_PROTOCOL_VERSION=3
      - CASSANDRA_KEYSPACE=jaeger_v1_dc1

  # Jaeger Collector
  jaeger-collector:
    image: jaegertracing/jaeger-collector:latest
    container_name: dl-creator-jaeger-collector
    ports:
      - "14250:14250"  # gRPC
      - "14268:14268"  # HTTP
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - SPAN_STORAGE_TYPE=cassandra
      - CASSANDRA_SERVERS=cassandra:9042
      - CASSANDRA_KEYSPACE=jaeger_v1_dc1
      - CASSANDRA_LOCAL_DC=dc1
      - COLLECTOR_OTLP_ENABLED=true
    depends_on:
      - jaeger-schema
    networks:
      - dl-creator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger Query Service
  jaeger-query:
    image: jaegertracing/jaeger-query:latest
    container_name: dl-creator-jaeger-query
    ports:
      - "16686:16686"  # Jaeger UI
    environment:
      - SPAN_STORAGE_TYPE=cassandra
      - CASSANDRA_SERVERS=cassandra:9042
      - CASSANDRA_KEYSPACE=jaeger_v1_dc1
      - CASSANDRA_LOCAL_DC=dc1
    depends_on:
      - jaeger-schema
    networks:
      - dl-creator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16687/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger Agent
  jaeger-agent:
    image: jaegertracing/jaeger-agent:latest
    container_name: dl-creator-jaeger-agent
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
    environment:
      - REPORTER_GRPC_HOST_PORT=jaeger-collector:14250
    depends_on:
      - jaeger-collector
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Loki - Log Aggregation System
  loki:
    image: grafana/loki:2.9.0
    container_name: dl-creator-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Promtail - Log Shipper
  promtail:
    image: grafana/promtail:2.9.0
    container_name: dl-creator-promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log
      - /var/log:/var/log/host:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - dl-creator-network
    restart: unless-stopped

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: dl-creator-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - rasa-server
    networks:
      - dl-creator-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  cassandra_data:
  loki_data:

networks:
  dl-creator-network:
    driver: bridge
