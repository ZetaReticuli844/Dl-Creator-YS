spring.application.name=dl_creator

server.port=7500


# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:dl_creator_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=3600000


management.tracing.sampling.probability=1.0
tracing.url=http://localhost:4317

management.tracing.enabled=true
server.address=0.0.0.0

# OpenTelemetry Configuration
otel.service.name=dl-creator-backend
otel.service.version=1.0.0
otel.resource.attributes=service.name=dl-creator-backend,service.version=1.0.0,deployment.environment=development
otel.exporter.otlp.endpoint=http://localhost:4317
otel.exporter.otlp.protocol=grpc


# expose prometheus endpoint
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=*


# Logging level
logging.level.root=INFO
logging.level.com.dlyog=DEBUG

# Log file location
logging.file.name=data/backend-logs/backend.log

# JSON Logging Configuration for Loki
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","level":"%level","logger":"%logger{36}","message":"%msg","thread":"%thread"}%n
logging.pattern.file={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","level":"%level","logger":"%logger{36}","message":"%msg","thread":"%thread"}%n

# Log file rotation
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
